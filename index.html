<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shayan FX Trader | Forex & Gold Specialist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: rgba(22, 28, 45, 0.85);
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7);
            --gold-primary: #D4AF37;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            text-align: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .gradient-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .btn-filter-modal {
            background: var(--gold-gradient);
            color: #000;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
        }

        .btn-filter-modal:hover {
            transform: scale(1.05);
        }

        /* Modal Base - Strictly Hidden */
        .modal-overlay {
            display: none; /* Changed: Strictly hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-card {
            background: #111827;
            border: 1px solid var(--gold-primary);
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            padding: 25px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .btn-submit-form {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--gold-gradient);
            color: #000;
            font-weight: 700;
            cursor: pointer;
        }

        #filterMessage {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Shayan FX Trader</div>
    </header>

    <section class="hero">
        <h1>Trade With Confidence & <span class="gradient-text">Master Gold</span></h1>
        <p>Shayan FX Trader | XAUUSD Specialist | Forex Mentor</p>
        
        <!-- DIRECT JAVASCRIPT IN ONCLICK -->
        <button class="btn-filter-modal" onclick="document.getElementById('myModal').style.display='flex'">
            <i class="fa-solid fa-user-check"></i> Apply for Mentorship / Signals
        </button>
    </section>

    <!-- Modal Pop-up -->
    <div class="modal-overlay" id="myModal">
        <div class="modal-card">
            <!-- DIRECT JAVASCRIPT IN ONCLICK -->
            <span class="modal-close" onclick="document.getElementById('myModal').style.display='none'">&times;</span>
            <h3 style="color:var(--gold-primary); margin-bottom: 10px;">Access Screening Form</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Fill details to connect directly.</p>

            <form onsubmit="submitForm(event)">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="uName" required>
                </div>

                <div class="form-group">
                    <label>Trading Experience *</label>
                    <select id="uExp" required>
                        <option value="Beginner">Beginner (0-6 months)</option>
                        <option value="Intermediate">Intermediate (1-2 years)</option>
                        <option value="Advanced">Advanced (2+ years)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Trading Equity / Capital *</label>
                    <select id="uCapital" required>
                        <option value="No Capital">Below $100 (Free Signals)</option>
                        <option value="$100 - $500">$100 - $500</option>
                        <option value="$500+">$500+</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit-form">Submit & Open WhatsApp</button>
            </form>

            <div id="filterMessage"></div>
        </div>
    </div>

    <script>
        function submitForm(e) {
            e.preventDefault();
            
            var name = document.getElementById('uName').value;
            var exp = document.getElementById('uExp').value;
            var capital = document.getElementById('uCapital').value;
            var msg = document.getElementById('filterMessage');

            if (capital === "No Capital") {
                msg.style.display = "block";
                msg.style.background = "rgba(239, 68, 68, 0.2)";
                msg.style.color = "#EF4444";
                msg.innerText = "Access Restricted: Minimum $100 trading capital required.";
                return;
            }

            msg.style.display = "block";
            msg.style.background = "rgba(16, 185, 129, 0.2)";
            msg.style.color = "#10B981";
            msg.innerText = "Success! Opening WhatsApp...";

            var textMsg = "Hello Shayan!%0AName: " + name + "%0AExperience: " + exp + "%0ACapital: " + capital;

            setTimeout(function() {
                window.open("https://wa.me/923008617023?text=" + textMsg, "_blank");
                document.getElementById('myModal').style.display='none';
            }, 800);
        }
    </script>
</body>
</html>
