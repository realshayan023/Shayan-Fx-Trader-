<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shayan FX Trader | Forex & Gold Specialist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: rgba(22, 28, 45, 0.85);
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7);
            --gold-primary: #D4AF37;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --border-color: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Trading Chart Canvas Animation Background */
        #chartCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.18;
        }

        /* 1. ANIMATION: Live Ticker Marquee */
        .ticker-wrap {
            width: 100%;
            background: rgba(16, 185, 129, 0.08);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            overflow: hidden;
            padding: 8px 0;
            white-space: nowrap;
            position: relative;
            z-index: 10;
        }

        .ticker-move {
            display: inline-block;
            animation: ticker 25s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            padding: 0 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .up { color: var(--accent-green); }
        .down { color: var(--accent-red); }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* Keyframes for Floating and Pulse */
        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.7); }
        }

        /* Sticky Glass Navbar */
        header {
            position: sticky;
            top: 0;
            backdrop-filter: blur(12px);
            background: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold-primary);
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .hero-text h1 {
            font-size: 3.2rem;
            line-height: 1.2;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .gradient-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* 2. ANIMATION: Glowing Pulsing Button */
        .btn-filter-modal {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--gold-gradient);
            color: #000;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            animation: pulseGlow 2.5s infinite;
            transition: all 0.3s ease;
        }

        .btn-filter-modal:hover {
            transform: scale(1.05);
        }

        /* Profile Photo Container */
        .hero-img-container {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .hero-img-card {
            width: 100%;
            max-width: 360px;
            height: 460px;
            border-radius: 24px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
            z-index: 1;
            background: #111827;
        }

        .hero-img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 3. ANIMATION: Floating Badges */
        .floating-badge {
            position: absolute;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .badge-1 { 
            top: 20px; 
            left: -20px; 
            animation: floatAnimation 3s ease-in-out infinite;
        }

        .badge-2 { 
            bottom: 20px; 
            right: -20px; 
            animation: floatAnimation 3.5s ease-in-out infinite 0.5s;
        }

        .floating-badge i {
            color: var(--gold-primary);
            font-size: 1.2rem;
        }

        /* Stats Section */
        .stats-section {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        /* 4. ANIMATION: Hover Card Zoom Effects */
        .stat-card, .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .stat-card:hover, .service-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold-primary);
        }

        .stat-card h3 {
            font-size: 2.5rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-card p { color: var(--text-muted); font-size: 0.95rem; }

        /* Services Section */
        .services {
            max-width: 1200px;
            margin: 100px auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .service-card i {
            font-size: 2.2rem;
            color: var(--gold-primary);
            margin-bottom: 20px;
        }

        .service-card h3 { margin-bottom: 12px; font-size: 1.25rem; }
        .service-card p { color: var(--text-muted); font-size: 0.9rem; }
        .section-title { text-align: center; font-size: 2.2rem; margin-bottom: 40px; }

        /* Footer */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            margin-top: 80px;
            position: relative;
            z-index: 2;
        }

        /* Membership Screening Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-card {
            background: #111827;
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .modal-close:hover { color: var(--gold-primary); }

        .modal-card h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main); }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
        }

        .form-group select option { background: #111827; color: var(--text-main); }

        .btn-submit-form {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var
