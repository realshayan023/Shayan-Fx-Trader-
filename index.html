<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shayan FX Trader | Forex & Gold Specialist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: rgba(22, 28, 45, 0.95);
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7);
            --gold-primary: #D4AF37;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --border-color: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Fixed Background Canvas */
        #chartCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            opacity: 0.2;
        }

        /* Live Marquee Ticker */
        .ticker-wrap {
            width: 100%;
            background: rgba(16, 185, 129, 0.1);
            border-bottom: 1px solid rgba(16, 185, 129, 0.25);
            overflow: hidden;
            padding: 8px 0;
            white-space: nowrap;
            position: relative;
            z-index: 10;
        }

        .ticker-move {
            display: inline-block;
            animation: ticker 25s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            padding: 0 15px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .up { color: var(--accent-green); }
        .down { color: var(--accent-red); }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.7); }
        }

        /* Sticky Glass Navbar */
        header {
            position: sticky;
            top: 0;
            backdrop-filter: blur(12px);
            background: rgba(11, 15, 25, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .logo {
            font-size: 0.95rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 12px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--gold-primary); }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .hero-text h1 {
            font-size: 2.8rem;
            line-height: 1.2;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .gradient-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .btn-filter-modal {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold-gradient);
            color: #000;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            animation: pulseGlow 2.5s infinite;
            transition: all 0.3s ease;
        }

        .btn-filter-modal:hover { transform: scale(1.05); }

        /* Profile Card */
        .hero-img-container {
            position: relative;
            display: flex;
            justify-content: center;
        }

            width: 10
