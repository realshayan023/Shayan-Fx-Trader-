<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shayan FX Trader | Forex & Gold Specialist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: rgba(22, 28, 45, 0.9);
            --gold-gradient: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7);
            --gold-primary: #D4AF37;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --border-color: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Animated Background Canvas */
        #chartCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            opacity: 0.25;
        }

        /* Live Marquee Ticker */
        .ticker-wrap {
            width: 100%;
            background: rgba(16, 185, 129, 0.1);
            border-bottom: 1px solid rgba(16, 185, 129, 0.25);
            overflow: hidden;
            padding: 10px 0;
            white-space: nowrap;
            position: relative;
            z-index: 10;
        }

        .ticker-move {
            display: inline-block;
            animation: ticker 25s linear infinite;
        }

        .ticker-item {
            display: inline-block;
            padding: 0 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .up { color: var(--accent-green); }
        .down { color: var(--accent-red); }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        @keyframes floatAnimation {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.7); }
        }

        /* Navbar */
        header {
            position: sticky;
            top: 0;
            backdrop-filter: blur(12px);
            background: rgba(11, 15, 25, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold-primary);
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .hero-text h1 {
            font-size: 3rem;
            line-height: 1.2;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .gradient-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .btn-filter-modal {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold-gradient);
            color: #000;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            animation: pulseGlow 2.5s infinite;
            transition: all 0.3s ease;
        }

        .btn-filter-modal:hover {
            transform: scale(1.05);
        }

        /* Profile Card */
        .hero-img-container {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .hero-img-card {
            width: 100%;
            max-width: 350px;
            height: 440px;
            border-radius: 24px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
            z-index: 1;
            background: #111827;
        }

        .hero-img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .floating-badge {
            position: absolute;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .badge-1 { 
            top: 20px; 
            left: -15px; 
            animation: floatAnimation 3s ease-in-out infinite;
        }

        .badge-2 { 
            bottom: 20px; 
            right: -15px; 
            animation: floatAnimation 3.5s ease-in-out infinite 0.5s;
        }

        .floating-badge i {
            color: var(--gold-primary);
            font-size: 1.2rem;
        }

        /* Stats & Services & New Sections */
        .stats-section, .services, .live-chart-section, .reviews-section, .faq-section {
            max-width: 1200px;
            margin: 70px auto;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .stats-section, .services-grid, .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .stat-card, .service-card, .review-card, .faq-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .stat-card:hover, .service-card:hover, .review-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold-primary);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }

        .stat-card { text-align: center; }

        .stat-card h3 {
            font-size: 2.2rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-card p, .service-card p { color: var(--text-muted); font-size: 0.9rem; }
        .service-card i { font-size: 2rem; color: var(--gold-primary); margin-bottom: 15px; }
        .service-card h3 { margin-bottom: 10px; font-size: 1.2rem; }
        .section-title { text-align: center; font-size: 2rem; margin-bottom: 35px; }

        /* NEW ADDITIONS: Testimonials Style */
        .review-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stars { color: #F59E0B; font-size: 0.9rem; }
        .review-text { font-size: 0.9rem; color: var(--text-muted); font-style: italic; }
        .user-info strong { display: block; color: var(--text-main); font-size: 0.95rem; }
        .user-info span { font-size: 0.8rem; color: var(--gold-primary); }

        /* NEW ADDITIONS: FAQ Accordion Style */
        .faq-item {
            margin-bottom: 12px;
            cursor: pointer;
        }
        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1rem;
        }
        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .faq-item.active .faq-answer {
            max-height: 150px;
            margin-top: 10px;
        }
        .faq-item.active .faq-question i {
            transform: rotate(180deg);
            color: var(--gold-primary);
        }

        /* NEW ADDITIONS: Floating Social Button */
        .floating-socials {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 999;
        }
        .float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.4rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            text-decoration: none;
        }
        .float-btn:hover { transform: scale(1.15); }
        .btn-wa { background: #25D366; }

        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px 20px;
            text-align: center;
            color: var(--text-muted);
            margin-top: 60px;
            position: relative;
            z-index: 2;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-card {
            background: #111827;
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            padding: 25px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-close {
            position: absolute;
            top: 15px;
